<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafoglio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0e1015; --panel:#161922; --panel2:#1d212c; --line:#262b38;
  --txt:#e8eaf0; --dim:#8a93a6; --accent:#e3b23c; --accent2:#38bdf8; --pos:#34d399; --neg:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:'DM Mono',monospace}
h1,h2,h3,.disp{font-family:'Syne',sans-serif;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:'DM Mono',monospace;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}

/* Login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px;width:340px;max-width:92vw}
#login h1{font-size:24px;margin-bottom:4px}
#login p{color:var(--dim);font-size:13px;margin-bottom:22px}
#login label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:14px 0 6px}
#login button{width:100%;margin-top:22px;background:var(--accent);color:#1a1200;border:none;padding:12px;border-radius:10px;font-weight:600;font-size:14px}
#login .err{color:var(--neg);font-size:12px;margin-top:14px;min-height:16px;font-family:'DM Mono',monospace}

/* Shell */
#app{display:none;max-width:1160px;margin:0 auto;padding:20px 18px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
header.top .brand{font-family:'Syne';font-weight:800;font-size:20px}
header.top .brand span{color:var(--accent)}
.headright{display:flex;align-items:center;gap:12px}
.eurusd{font-size:12px;color:var(--dim)}
.eurusd b{color:var(--txt)}
.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:8px;font-size:12px}
.ghost:hover{border-color:var(--accent)}
.status{font-size:11px;color:var(--dim);font-family:'DM Mono';min-width:60px;text-align:right}

/* Tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:none;color:var(--dim);padding:10px 14px;font-size:14px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--txt);border-bottom-color:var(--accent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:6px}
.kpi .val{font-family:'DM Mono';font-size:20px;font-weight:500}
.kpi .sub{font-size:12px;font-family:'DM Mono';margin-top:2px}

/* Charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.chartcard h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:10px;font-family:'Inter';font-weight:600}
.chartwrap{position:relative;height:180px}

/* Table */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.actions button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;font-size:12px}
.actions button:hover{border-color:var(--accent)}
.actions button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.panel .phead{padding:12px 16px;border-bottom:1px solid var(--line);font-family:'Syne';font-weight:700;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:'DM Mono';white-space:nowrap}
td:first-child{text-align:left;font-family:'Inter'}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
.nm{font-weight:500}
.isin{font-size:11px;color:var(--dim);font-family:'DM Mono'}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);margin-left:6px;font-family:'DM Mono'}
.edit{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:4px 8px;font-size:11px}
.edit:hover{border-color:var(--accent);color:var(--txt)}
.cashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:14px}
.cashcell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.cashcell .cn{font-size:12px;color:var(--dim);margin-bottom:4px}
.cashcell .cv{font-family:'DM Mono';font-size:16px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:440px;max-width:96vw;max-height:90vh;overflow:auto}
.modal h2{font-size:18px;margin-bottom:16px}
.modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:12px 0 5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;gap:10px;margin-top:20px}
.modal .foot button{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:600;border:none}
.modal .foot .cancel{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.modal .foot .save{background:var(--accent);color:#1a1200}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:6px}
.seg button{flex:1;background:none;border:none;color:var(--dim);padding:7px;border-radius:6px;font-size:12px}
.seg button.on{background:var(--accent);color:#1a1200;font-weight:600}
.minirow{display:grid;grid-template-columns:1fr 100px 30px;gap:8px;align-items:center;margin-bottom:8px}
.minirow button{background:var(--panel2);border:1px solid var(--line);color:var(--neg);border-radius:7px;padding:6px}
.addrow{background:var(--panel2);border:1px dashed var(--line);color:var(--dim);width:100%;padding:8px;border-radius:8px;font-size:12px;margin-top:4px}
.empty{padding:40px;text-align:center;color:var(--dim);font-size:13px}

.sp-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sp-seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg-b{background:none;border:none;color:var(--dim);padding:6px 13px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer}
.seg-b.on{background:var(--accent);color:#1a1200;font-weight:600}
.sp-act{background:var(--accent);color:#1a1200;border:none;padding:9px 13px;border-radius:9px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.sp-act.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.sp-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.sp-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--dim);font-family:'DM Mono'}
.sp-leg span{display:flex;align-items:center;gap:5px}.sp-leg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.sp-grid{grid-template-columns:1fr}}
.sp-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.sp-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;margin-bottom:4px;font-family:'Inter'}
.sp-sub{font-size:11px;color:var(--dim);margin-bottom:10px;font-family:'DM Mono'}
.sp-cw{position:relative;height:230px}
.sp-badge{display:inline-block;font-size:11px;font-family:'DM Mono';padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);margin-left:6px}
.sp-dd{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden;display:none}
.sp-ddh{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-family:'Syne';font-weight:700;font-size:13px}
.sp-ddh button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer}
.sp-tab{width:100%;border-collapse:collapse;font-size:12.5px}
.sp-tab th{text-align:right;padding:8px 12px;font-size:10px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.sp-tab th:first-child,.sp-tab td:first-child{text-align:left}
.sp-tab td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:'DM Mono'}
.sp-tab td.t{text-align:left;font-family:'Inter'}
.sp-note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:11px 14px;margin-top:14px;font-size:12.5px;color:var(--dim)}
.rg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.rg-bar label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 3px}
.rg-bar select,.rg-bar input{width:auto;min-width:104px}
.rg-bar #rg-q{width:100%}
.rg-bar label.rg-chk{margin:0 4px 8px}
.rg-chk{display:flex!important;align-items:center;gap:8px;text-transform:none!important;letter-spacing:0!important;font-size:12.5px!important;color:var(--txt)!important}
.rg-chk input{width:auto!important;min-width:0!important}
.rg-tab td.rg-d{white-space:normal;min-width:200px;max-width:420px}
.rg-tab tr.rg-off td{opacity:.45}
.rg-tab .rg-cb{width:auto;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h1>Portafoglio</h1>
    <p>Accedi per vedere i tuoi dati.</p>
    <label>Email</label>
    <input id="li-email" type="email" autocomplete="username" placeholder="tua@email.it">
    <label>Password</label>
    <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="li-btn">Accedi</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="top">
    <div class="brand">Porta<span>foglio</span></div>
    <div class="headright">
      <span class="eurusd" id="pricesWrap">Prezzi <b id="pricesAt">—</b></span>
      <span class="eurusd">EUR/USD <b id="eurusd">—</b></span>
      <span class="status" id="status"></span>
      <button class="ghost" id="logout">Esci</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
// ============================ CONFIG ============================
const SUPABASE_URL = "https://xrnujmdrtiliiqhntkwj.supabase.co";
const SUPABASE_KEY = "sb_publishable_-gGrlvd2-q2e-oJpUVYtuw_9JJo05yu";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================ STATE ============================
let state = { eurusd:1.14, last_updated:"", maicol:null, martina:null, storico:{maicol:[],martina:[]}, transactions:[] };
let currentTab = "maicol";
let charts = {};

const $ = s => document.querySelector(s);
const money = n => (n||0).toLocaleString('it-IT',{maximumFractionDigits:0});
const money2 = n => (n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const setStatus = t => { $("#status").textContent = t; if(t) setTimeout(()=>{if($("#status").textContent===t)$("#status").textContent="";},2500); };

// ============================ AUTH ============================
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ enterApp(); } else { $("#login").style.display="flex"; }
}
$("#li-btn").onclick = async () => {
  const email = $("#li-email").value.trim(), pass = $("#li-pass").value;
  $("#li-err").textContent = "";
  $("#li-btn").textContent = "Accesso…";
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  $("#li-btn").textContent = "Accedi";
  if(error){ $("#li-err").textContent = error.message; return; }
  enterApp();
};
$("#li-pass").addEventListener("keydown", e => { if(e.key==="Enter") $("#li-btn").click(); });
$("#logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function enterApp(){
  $("#login").style.display="none";
  $("#app").style.display="block";
  setStatus("Carico…");
  await loadAll();
  setStatus("");
  buildTabs();
  render();
}

// ============================ LOAD ============================
async function loadAll(){
  const [hold, pri, setg, cash, pens, hist, tx] = await Promise.all([
    sb.from('holdings').select('*'),
    sb.from('prices').select('*'),
    sb.from('settings').select('*'),
    sb.from('cash_items').select('*').order('sort_order'),
    sb.from('pension_items').select('*'),
    sb.from('history_snapshots').select('*').order('snap_date'),
    sb.from('transactions').select('*').order('ts',{ascending:false}).limit(500),
  ]);
  if(hold.error){ alert("Errore lettura dati: "+hold.error.message); return; }

  const priceMap = {}; (pri.data||[]).forEach(p => priceMap[p.isin] = p.market_price);
  const stamps = (pri.data||[]).map(p=>p.updated_at).filter(Boolean).sort();
  state.prices_at = stamps.length ? stamps[stamps.length-1] : "";
  state.prices_old = state.prices_at ? (pri.data||[]).filter(p=>!p.updated_at || (new Date(state.prices_at)-new Date(p.updated_at))>3*864e5).length : 0;
  const settings = {}; (setg.data||[]).forEach(s => settings[s.key] = s.value);
  state.eurusd = parseFloat(settings.eurusd) || 1.14;
  state.last_updated = settings.last_updated || "";

  const mk = pf => ({
    holdings: (hold.data||[]).filter(h=>h.portfolio===pf).map(h=>({
      ...h, market_price: priceMap[h.isin] ?? 0
    })),
    cash_items: (cash.data||[]).filter(c=>c.portfolio===pf),
    pension_items: (pens.data||[]).filter(p=>p.portfolio===pf),
  });
  state.maicol = mk('maicol');
  state.martina = mk('martina');
  state.storico.maicol = (hist.data||[]).filter(h=>h.portfolio==='maicol');
  state.storico.martina = (hist.data||[]).filter(h=>h.portfolio==='martina');
  state.transactions = tx.data||[];
}

// ============================ CALC ============================
const rate = h => h.currency==='USD' ? state.eurusd : 1;
const valEur = h => (h.qty * h.market_price) / rate(h);
const costEur = h => (h.qty * h.avg_price) / rate(h);

function totals(holdings, cash_items, pension_items){
  const invested = holdings.reduce((s,h)=>s+valEur(h),0);
  const cost = holdings.reduce((s,h)=>s+costEur(h),0);
  const cassa = (cash_items||[]).reduce((s,c)=>s+ (+c.value||0),0);
  const pensione = (pension_items||[]).reduce((s,p)=>s+(+p.value||0),0);
  const pl = invested - cost;
  return { invested, cost, cassa, pensione, pl, plpct: cost? pl/cost*100:0, total: invested+cassa+pensione };
}

function geoAgg(holdings){
  const g = {};
  holdings.forEach(h=>{
    const v = valEur(h);
    if(h.geo_breakdown && typeof h.geo_breakdown==='object'){
      for(const k in h.geo_breakdown){ g[k]=(g[k]||0)+v*(h.geo_breakdown[k]/100); }
    } else { const k=h.geo||'Altro'; g[k]=(g[k]||0)+v; }
  });
  return g;
}
function keyAgg(holdings, field){
  const g={}; holdings.forEach(h=>{ const k=h[field]||'—'; g[k]=(g[k]||0)+valEur(h); }); return g;
}


// Ultimo aggiornamento prezzi: il bot gira lun-ven alle 19:30 UTC. Verde = in regola, giallo = in ritardo, rosso = saltato.
function lastExpectedRun(){
  const n=new Date();let d=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate(),19,30));
  if(d>n)d=new Date(d-864e5);
  while([0,6].includes(d.getUTCDay()))d=new Date(d-864e5);
  return d;
}
function showPricesAge(){
  const el=$("#pricesAt"),wrap=$("#pricesWrap");if(!el)return;
  if(!state.prices_at){el.textContent="—";wrap.title="Nessun prezzo salvato";return;}
  const d=new Date(state.prices_at),lag=(lastExpectedRun()-d)/36e5;
  el.textContent=d.toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  el.style.color=lag<=3?'var(--pos)':(lag<=27?'var(--accent)':'var(--neg)');
  wrap.title="Ultimo aggiornamento: "+d.toLocaleString('it-IT',{dateStyle:'full',timeStyle:'short'})
    +(lag>3?"\nATTENZIONE: l'aggiornamento automatico di "+lastExpectedRun().toLocaleDateString('it-IT')+" non risulta eseguito.":"")
    +(state.prices_old?"\n"+state.prices_old+(state.prices_old===1?" prezzo non si aggiorna":" prezzi non si aggiornano")+" da oltre 3 giorni (manuale o non trovato).":"");
}
// ============================ RENDER ============================
function buildTabs(){
  const tabs=[["maicol","Maicol"],["martina","Martina"],["combinato","Combinato"],["storico","Storico"],["movimenti","Movimenti"],["spese","Spese"],["registro","Registro"]];
  $("#tabs").innerHTML = tabs.map(([k,l])=>`<button class="tab ${k===currentTab?'active':''}" data-tab="${k}">${l}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;buildTabs();render();});
}

function render(){
  $("#eurusd").textContent = state.eurusd.toFixed(4);
  showPricesAge();
  Object.values(charts).forEach(c=>c&&c.destroy()); charts={};
  const v=$("#view");
  if(currentTab==='maicol') v.innerHTML=portfolioHTML('maicol');
  else if(currentTab==='martina') v.innerHTML=portfolioHTML('martina');
  else if(currentTab==='combinato') v.innerHTML=combinedHTML();
  else if(currentTab==='storico') v.innerHTML=storicoHTML();
  else if(currentTab==='movimenti') v.innerHTML=movimentiHTML();
  else if(currentTab==='spese'){ renderSpese(); return; }
  else if(currentTab==='registro'){ renderRegistro(); return; }
  if(currentTab==='maicol'){ drawDonuts('maicol', state.maicol.holdings); wirePortfolio('maicol'); }
  if(currentTab==='martina'){ drawDonuts('martina', state.martina.holdings); wirePortfolio('martina'); }
  if(currentTab==='combinato'){ drawDonuts('comb', [...state.maicol.holdings,...state.martina.holdings]); }
  if(currentTab==='storico'){ drawStorico(); wireStorico(); }
}

function kpiRow(t, withPension){
  const plc = t.pl>=0?'pos':'neg', s=t.pl>=0?'+':'';
  return `<div class="kpis">
    <div class="kpi"><div class="lab">Investito</div><div class="val">€${money(t.invested)}</div></div>
    <div class="kpi"><div class="lab">P&L</div><div class="val ${plc}">${s}€${money(t.pl)}</div><div class="sub ${plc}">${s}${t.plpct.toFixed(1)}%</div></div>
    <div class="kpi"><div class="lab">Cassa</div><div class="val">€${money(t.cassa)}</div></div>
    ${withPension?`<div class="kpi"><div class="lab">Pensione</div><div class="val">€${money(t.pensione)}</div></div>`:''}
    <div class="kpi"><div class="lab">Totale</div><div class="val">€${money(t.total)}</div></div>
  </div>`;
}

function donutCards(pref){
  return `<div class="charts">
    <div class="chartcard"><h3>Strumento</h3><div class="chartwrap"><canvas id="${pref}-detail"></canvas></div></div>
    <div class="chartcard"><h3>Categoria</h3><div class="chartwrap"><canvas id="${pref}-type"></canvas></div></div>
    <div class="chartcard"><h3>Geografia</h3><div class="chartwrap"><canvas id="${pref}-geo"></canvas></div></div>
    <div class="chartcard"><h3>Asset</h3><div class="chartwrap"><canvas id="${pref}-asset"></canvas></div></div>
  </div>`;
}

function positionsTable(pf){
  const hs = state[pf].holdings;

  const rows = hs.slice().sort((a,b)=>valEur(b)-valEur(a)).map(h=>{
    const pl = valEur(h)-costEur(h), plc=pl>=0?'pos':'neg', s=pl>=0?'+':'';
    const plp = costEur(h)? pl/costEur(h)*100:0;
    return `<tr>
      <td><span class="nm">${h.name}</span><span class="badge">${h.detail||''}</span><br><span class="isin">${h.isin}</span></td>
      <td>${(+h.qty).toLocaleString('it-IT',{maximumFractionDigits:4})}</td>

      <td>${money2(h.market_price)}${h.currency==='USD'?' <span class="dim">$</span>':''}</td>
      <td>€${money(valEur(h))}</td>
      <td class="${plc}">${s}€${money(pl)}<br><span style="font-size:11px">${s}${plp.toFixed(1)}%</span></td>
      <td><button class="edit" data-edit="${pf}|${h.isin}">✎</button></td>

  }).join("");
  return `<div class="panel"><div class="phead">Posizioni</div>

}

// edit position: buy vs direct
function modalEdit(pf,isin){
  const h=state[pf].holdings.find(x=>x.isin===isin); if(!h) return;
  let mode='buy';
  const body=()=>`
    <h2>${h.name}</h2>
    <div class="seg"><button data-m="buy" class="${mode==='buy'?'on':''}">Nuovo acquisto</button><button data-m="direct" class="${mode==='direct'?'on':''}">Modifica diretta</button></div>
    <div id="mbody"></div>
    <div class="foot"><button class="cancel" data-close>Annulla</button><button class="save" id="msave">Salva</button></div>`;
  const buyBody=`<div class="dim mono" style="font-size:12px;margin:8px 0">Attuale: ${(+h.qty).toLocaleString('it-IT')} @ €${money2(h.avg_price)}</div>
    <label>Quantità acquistata</label><input id="f-nq" type="number" step="any" placeholder="0">
    <label>Prezzo di acquisto (${h.currency})</label><input id="f-np" type="number" step="any" placeholder="0">`;
  const directBody=`<div class="row2"><div><label>Quantità</label><input id="f-q" type="number" step="any" value="${h.qty}"></div>
    <div><label>Prezzo medio</label><input id="f-a" type="number" step="any" value="${h.avg_price}"></div></div>
    <label>Prezzo di mercato (${h.currency})</label><input id="f-m" type="number" step="any" value="${h.market_price}">`;
  openModal(body());
  const paint=()=>{ $("#mbody").innerHTML = mode==='buy'?buyBody:directBody; };
  paint();
  const rewire=()=>{
    modalEl.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;openModal(body());paint();rewire();});
    $("#msave").onclick=async()=>{
      if(mode==='buy'){
        const nq=parseFloat($("#f-nq").value), np=parseFloat($("#f-np").value);
        if(!(nq>0)||!(np>=0)){alert("Inserisci quantità e prezzo.");return;}
        const tq=(+h.qty)+nq, na=((+h.qty)*(+h.avg_price)+nq*np)/tq;
        await saveHolding(pf,{...h,qty:tq,avg_price:na});
        await logTx(pf,`Acquisto ${h.name}: +${nq} @ ${np} ${h.currency}`);
      } else {
        const q=parseFloat($("#f-q").value), a=parseFloat($("#f-a").value), m=parseFloat($("#f-m").value);
        await saveHolding(pf,{...h,qty:q,avg_price:a});
        await savePrice(h.isin,m);
        await logTx(pf,`Modifica diretta ${h.name}`);
      }
      closeModal(); setStatus("Salvato"); await loadAll(); render();
    };
  };
  rewire();
}

function exportPortafoglio(){

      Nome:h.name,ISIN:h.isin,Strumento:h.detail,Categoria:h.type,Valuta:h.currency,
      Quantita:h.qty,PMC:h.avg_price,Prezzo:h.market_price,
      "Valore EUR":Math.round(v*100)/100,"Costo EUR":Math.round(c*100)/100,
      "PL EUR":Math.round((v-c)*100)/100,"PL %":c?Math.round((v-c)/c*1000)/10:0,
      Geografia:h.geo,Asset:h.asset};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Posizioni "+nome[pf]);
  });
  const cash=[];['maicol','martina'].forEach(pf=>state[pf].cash_items.forEach(c=>cash.push({Persona:nome[pf],Voce:c.name,"Valore EUR":c.value})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cash),"Cassa");
  const pens=[];['maicol','martina'].forEach(pf=>(state[pf].pension_items||[]).forEach(p=>pens.push({Persona:nome[pf],Voce:p.name,"Valore EUR":p.value})));

/* ===================== MODULO SPESE ===================== */
const spState={tab:'Maicol',per:'12m',gran:'annuale',drill:null,rows:null,charts:{},impRecs:[]};
const spEur=n=>'€'+Math.round(n).toLocaleString('it-IT');
const spSum=a=>a.reduce((x,y)=>x+y,0);
async function spLoad(){let all=[],from=0,pg=1000;while(true){const{data,error}=await sb.from('expenses').select('*').order('id',{ascending:true}).range(from,from+pg-1);if(error){alert('Spese: '+error.message);break;}all=all.concat(data||[]);if(!data||data.length<pg)break;from+=pg;}return all;}
function spSubset(){return spState.tab==='Combinato'?spState.rows:spState.rows.filter(r=>r.persona===spState.tab);}
function spAgg(rows){const fl=rows.filter(r=>['reddito','rimborso','spesa','investimento'].includes(r.tipo)&&r.conta!=='no');const yearly={entrate:{},uscite:{},investimenti:{}},monthly={},mesi={},cat={};let altro=0,spTot=0;for(const r of fl){const y=(r.data||'').slice(0,4),m=(r.data||'').slice(0,7),v=+r.importo_eur;(mesi[y]=mesi[y]||new Set()).add(m);monthly[m]=monthly[m]||{e:0,u:0,i:0};if(r.tipo==='reddito'||r.tipo==='rimborso'){monthly[m].e+=v;yearly.entrate[y]=(yearly.entrate[y]||0)+v;}else if(r.tipo==='spesa'){const a=Math.abs(v);monthly[m].u+=a;yearly.uscite[y]=(yearly.uscite[y]||0)+a;cat[r.categoria]=(cat[r.categoria]||0)+a;spTot+=a;if(r.categoria==='Altro')altro+=a;}else{const a=Math.abs(v);monthly[m].i+=a;yearly.investimenti[y]=(yearly.investimenti[y]||0)+a;}}const years=Object.keys(mesi).sort();const mesi_anno={};years.forEach(y=>mesi_anno[y]=mesi[y].size);return{years,yearly,monthly,mesi_anno,cat,altroPct:spTot?altro/spTot*100:0,months:Object.keys(monthly).sort()};}
function spPeriodSel(A,p){if(p==='12m')return A.months.slice(-12);if(p==='anno'){const y=A.years[A.years.length-1];return A.months.filter(m=>m.startsWith(y));}return A.months;}
function spTotFor(A,ms){return{e:spSum(ms.map(m=>A.monthly[m].e)),u:spSum(ms.map(m=>A.monthly[m].u)),i:spSum(ms.map(m=>A.monthly[m].i))};}
function spDelta(cur,prev,lowerBetter){if(!prev)return '';const p=Math.round((cur-prev)/prev*100);const good=lowerBetter?p<=0:p>=0;return `<span style="color:${good?'var(--pos)':'var(--neg)'}">${p>=0?'+':''}${p}% vs prec.</span>`;}
function speseUI(){
  const seg=['Maicol','Martina','Combinato'].map(t=>`<button class="seg-b ${t===spState.tab?'on':''}" data-sp-tab="${t}">${t}</button>`).join('');
  const psel=[["12m","Ultimi 12 mesi"],["anno","Quest'anno"],["tutto","Tutto"]].map(a=>`<button class="seg-b ${a[0]===spState.per?'on':''}" data-sp-per="${a[0]}">${a[1]}</button>`).join('');
  return `
  <div class="sp-top">
    <div class="sp-seg">${seg}</div>
    <div style="display:flex;gap:8px"><button class="sp-act ghost" id="sp-imp">Importa</button><button class="sp-act" id="sp-exp">Esporta Excel</button></div>
  </div>
  <div class="sp-seg" style="margin-bottom:12px">${psel}</div>

const bkS=v=>v==null?'':String(v);

function bkNum(v){if(typeof v==='number')return v;let s=bkS(v).trim();if(!s||s==='-')return NaN;if(/,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s);}
function bkDate(v){
  if(typeof v==='number'&&isFinite(v))return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=bkS(v).trim();let m;

function bkDetect(grid){

// Memoria: riusa categoria/tipo gia' assegnati nello storico alla stessa descrizione (piu' frequente)
function bkMemory(rows){
  const cnt={};
  for(const r of rows){
    if(r.fonte!=='Credem'&&r.fonte!=='Revolut')continue;
    const d=bkS(r.descrizione).slice(0,60),v=+r.importo_eur;
    for(const k of [`${r.fonte}|${d}|${bkR2(v)}`,`${r.fonte}|${d}|${v<0?'-':'+'}`]){
      const o=cnt[k]=cnt[k]||{},j=JSON.stringify([r.categoria,r.tipo,r.canale]);o[j]=(o[j]||0)+1;
    }
  }
  const mem={};
  for(const k in cnt){let best=null,bn=0;for(const j in cnt[k])if(cnt[k][j]>bn){bn=cnt[k][j];best=j;}const a=JSON.parse(best);mem[k]={categoria:a[0],tipo:a[1],canale:a[2]};}
  return mem;
}
function bkApplyMem(mem,fonte,desc,v,base){
  if(!mem||base.tipo==='annullato')return base;
  const d=bkS(desc).slice(0,60),m=mem[`${fonte}|${d}|${bkR2(v)}`]||mem[`${fonte}|${d}|${v<0?'-':'+'}`];
  if(!m||m.tipo==='annullato')return base;
  let tipo=m.tipo;if(v>0&&tipo==='spesa')tipo=/famiglia|ricevut/i.test(m.categoria)?'giroconto':/rimbors/i.test(m.categoria)?'rimborso':'reddito';

const bkConta=t=>t==='escluso'?'no':'sì';
// CSV con separatore , o ; (gestisce virgolette e a-capo tra virgolette)
function bkCsv(text,d){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
// Download sovrapposti incollati nello stesso file: un giorno in cui OGNI riga compare almeno 2 volte identica e' un giorno raddoppiato
function bkUndouble(items){
  const cnt={},day={};
  for(const x of items){cnt[x.key]=(cnt[x.key]||0)+1;(day[x.data]=day[x.data]||new Set()).add(x.key);}
  const used={},keep=[];let doppie=0;
  for(const x of items){
    if([...day[x.data]].every(k=>cnt[k]>=2)){const n=used[x.key]=(used[x.key]||0)+1;if(n>Math.floor(cnt[x.key]/2)){doppie++;continue;}}
    keep.push(x);
  }
  return{keep,doppie};
}
const bkMonth=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
function bkMonthsWithin(ini,fine){ // mesi interamente compresi tra due date ISO
  const out=[];let y=+ini.slice(0,4),m=+ini.slice(5,7);
  for(let n=0;n<240;n++){
    const st=bkMonth(y,m)+'-01',last=new Date(Date.UTC(y,m,0)).getUTCDate(),en=bkMonth(y,m)+'-'+String(last).padStart(2,'0');
    if(st>fine)break;
    if(st>=ini&&en<=fine)out.push(bkMonth(y,m));
    m++;if(m>12){m=1;y++;}
  }
  return out;
}
function bkPrevMonth(d){let y=+d.slice(0,4),m=+d.slice(5,7)-1;if(m<1){m=12;y--;}return bkMonth(y,m);}

function bkCredemClass(D,C,v){
  const U=D.toUpperCase();
  if(/ADDEBITO MESE CARTA EGO/.test(U))return{canale:'Carta Ego',categoria:'Carta Ego',tipo:'spesa'};
  if(/SEPA DD CORE DA PAYPAL/.test(U))return v<0?{canale:'PayPal',categoria:'Abbonamenti',tipo:'spesa'}:{canale:'PayPal',categoria:'Rimborso',tipo:'rimborso'};
  const b={canale:'Credem c/c'};
  if(/PREAUTORIZZATO MORGAN STANLEY/.test(U))return{...b,categoria:'PAC',tipo:'investimento'};
  if(/(ACQUISTO|VENDITA) TITOLI|SOTTOSCRIZIONE FONDI|RIMBORSO TITOLI/.test(U))return{...b,categoria:'Titoli',tipo:'investimento'};
  if(/REVOLUT/.test(U))return{...b,categoria:'Giroconto Revolut',tipo:'giroconto'};
  if(BK_NOMI.famiglia.test(D))return{...b,categoria:'Famiglia',tipo:'giroconto'};
  if(/VERS\. ?CONTANTE|VERSAMENTO CONTANTE|VERS\. ASSEGNI/.test(U))return{...b,categoria:'Versamento contante/assegni',tipo:'giroconto'};
  if(BK_NOMI.datore.test(D)&&v>0)return{...b,categoria:/EMOLUMENTI/.test(U)?'Stipendio':BK_NOMI.datoreCat,tipo:'reddito'};
  if(/ALLIANZ BANK/.test(U)&&v>0)return{...b,categoria:'Trasferimento',tipo:'investimento'};
  if(/PRELIEVO|PREL\.? |COM PREL|COMM\.? PREL/.test(U))return{...b,categoria:'prelievo',tipo:'spesa'};
  if(/^(COMPETENZE|BOLLI? |BOLLO|CANONE|ONERI|COMM(\.|ISSION| )|IMPOSTA|SPESE|RECUPERO SPESE)/.test(U)||/^(COCUR|COINT|COCBI|CPCC|VBBOL|VBBOS|COPR)/.test(C||''))return{...b,categoria:'Spese banca',tipo:'spesa'};
  if(/^(PAGAMENTO|PAG\.)/.test(U))return{...b,categoria:'Pagamenti',tipo:'spesa'};
  if(/BONIFICO A DEBITO|BONIF\. .*DEBITO|BON\. ISTANTANEO A DEBITO/.test(U))return{...b,categoria:'Bonifico inviato',tipo:'spesa'};
  if(v>0)return{...b,categoria:'Entrata',tipo:'reddito'};
  return{...b,categoria:'Altro',tipo:'spesa'};
}
function bkCredem(grid,mem){
  const hi=grid.findIndex(r=>r.some(c=>bkS(c).trim()==='Data contabile')),H=grid[hi].map(c=>bkS(c).trim());
  const iD=H.indexOf('Data contabile'),iI=H.indexOf('Importo'),iC=H.indexOf('Causale'),iDs=H.findIndex(h=>h.startsWith('Descrizione'));
  const body=grid.slice(hi+1).map(r=>({r,data:bkDate(r[iD]),v:bkNum(r[iI]),key:r.slice(0,10).map(bkS).join('\u0001')})).filter(x=>x.data&&!isNaN(x.v));
  const skipped=grid.slice(hi+1).filter(r=>r.some(c=>bkS(c).trim())).length-body.length,{keep,doppie}=bkUndouble(body),rows=[];
  for(const x of keep){
    const desc=bkS(x.r[iDs]).slice(0,80),cl=bkApplyMem(mem,'Credem',desc,x.v,bkCredemClass(desc,bkS(x.r[iC]).trim(),x.v));

const BK_REV_CAT=[

  ['Viaggi',/booking|airbnb|trip\.com|hotel|hostel|klook|agoda|flixbus|trenitalia|italo|ryanair|easyjet|airline|airways|uber|grab\b|taxi|didi|metro|railway|jr east|suica|pasmo/i],

  ['Shopping',/amazon|zara|h&m|uniqlo|muji|decathlon|ikea|aliexpress|taobao|shein|apple store/i],
  ['Sport',/gym|palestra|fitness|sport/i]

function bkRevClass(tipo,prod,desc,v){
  const T=tipo.trim(),D=desc.trim();
  if(/Digital Assets/i.test(D))return v<0?{categoria:'Crypto',tipo:'investimento'}:{categoria:'(interno)',tipo:'giroconto'}; // acquisti crypto = investimento; il rientro resta giroconto (gli investimenti si sommano in valore assoluto)
  if(T==='Interessi')return{categoria:'Interessi',tipo:'reddito'};
  if(T==='Cambia valuta'||T==='Ricarica'||T==='Addebita'||/senza vincoli|^Revolut Bank UAB$/i.test(D)||BK_NOMI.io.test(D))return{categoria:'(interno)',tipo:'giroconto'};
  if(T==='Prelievo')return{categoria:'prelievo',tipo:'spesa'};
  if(T==='Commissione')return{categoria:'Commissioni',tipo:'spesa'};
  if(T==='Rimborso su carta'||T==='CARD_CREDIT')return{categoria:'Rimborso',tipo:'rimborso'};
  if(/previdenza sociale|\bINPS\b/i.test(D))return{categoria:'Tasse/Contributi',tipo:'investimento'};
  if(BK_NOMI.famiglia.test(D))return{categoria:'Famiglia',tipo:'giroconto'};
  if(T==='Pagamento'){
    if(v>0)return{categoria:'Trasferimento ricevuto',tipo:'reddito'};
    return{categoria:'Bonifico inviato',tipo:'spesa'};
  }
  if(v>0)return{categoria:'Rimborso',tipo:'rimborso'};
  for(const [c,re] of BK_REV_CAT)if(re.test(D))return{categoria:c,tipo:'spesa'};
  return{categoria:'Altro',tipo:'spesa'};
}
function bkRevolut(grid,mem,fx){
  const H=grid[0].map(c=>bkS(c).trim()),ix=n=>H.indexOf(n);
  const iT=ix('Tipo'),iP=ix('Prodotto'),iD=ix(BK_REV_DATE),iD2=ix('Data di completamento'),iDs=ix('Descrizione'),iI=ix('Importo'),iV=ix('Valuta'),iS=ix('State');
  const rows=[],noFx={};let skipped=0;
  for(const r of grid.slice(1)){
    const data=bkDate(r[iD])||bkDate(r[iD2]),v=bkNum(r[iI]),cur=bkS(r[iV]).trim().toUpperCase(),st=bkS(r[iS]).trim().toUpperCase();
    if(!data||isNaN(v)||!cur){if(r.some(c=>bkS(c).trim()))skipped++;continue;}
    if(/SOSPES|PENDING|IN ATTESA/.test(st)){skipped++;continue;}
    const rate=cur==='EUR'?1:(BK_FX[cur]||(fx&&fx[cur]));
    if(!rate){noFx[cur]=(noFx[cur]||0)+1;continue;}
    const desc=bkS(r[iDs]),eur=cur==='EUR'?v:bkR2(v/rate);
    let cl=/ANNULL|REVERT|RIFIUT|DECLIN|FALLIT/.test(st)?{categoria:'(annullato)',tipo:'annullato'}:bkRevClass(bkS(r[iT]),bkS(r[iP]),desc,v);
    cl=bkApplyMem(mem,'Revolut',desc,eur,{canale:'Revolut',...cl});
    rows.push({persona:'Maicol',data,fonte:'Revolut',canale:'Revolut',descrizione:desc,fpDesc:desc,importo_orig:v,valuta:cur,importo_eur:eur,categoria:cl.categoria,tipo:cl.tipo,conta:bkConta(cl.tipo),fuzzy:true});
  }
  return{rows,skipped,noFx};
}

/* ---- Revolut: estratto CONSOLIDATO (una tabella per ogni conto in valuta) ----
   Ha la data di completamento (lo storico ha quella di inizio: scarto di 0-2 giorni), quindi le righe
   segnate "fuzzy" si confrontano con lo storico per descrizione + importo + data vicina (bkFuzzyDrop).
   Le tabelle degli interessi (importi netti, date in altra forma) e degli acquisti crypto non si importano. */
const BK_MESI={gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12};
function bkDateIt(s){
  const m=bkS(s).trim().match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]{3})[A-Za-z.]*\s+(\d{4})/),mo=m&&BK_MESI[m[2].toLowerCase()];
  return mo?`${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';
}
const bkMoney=s=>{const t=bkS(s).replace(/[^\d,.\-]/g,'');return t&&t!=='-'?parseFloat(t.replace(/\./g,'').replace(',','.')):NaN;};
const BK_REV_CATTIPO={'Esercente':'Pagamento con carta','Cambio valuta':'Cambia valuta','Ricarica':'Ricarica','Prelievo':'Prelievo','Rimborso':'Rimborso su carta','Commissione':'Commissione'};
function bkRevolutConsolidato(grid,mem){
  const rows=[];let cur=null,mode=null,skipped=0;
  for(const r of grid){
    const ne=r.filter(c=>bkS(c).trim());
    if(ne.length===1){
      const t=bkS(ne[0]).trim(),m=t.match(/^Conto personale \((\w+)\)/);
      if(m){cur=m[1];mode=null;}
      else if(/^Riepilogo delle transazioni/.test(t))mode='tx';
      else if(/^(Riepilogo della transazione|Riepilogo transazioni|Riepilogo delle posizioni|Investment Services|Crypto)/.test(t))mode=null;
      continue;
    }
    if(mode!=='tx'||!cur)continue;
    const data=bkDateIt(r[0]);if(!data)continue;               // salta intestazioni e righe "Totale"
    const v=bkMoney(r[3]);if(isNaN(v)){skipped++;continue;}
    const desc=bkS(r[1]),cat=bkS(r[2]).trim(),rate=BK_FX[cur];
    // valute gia' nello storico: stesso tasso fisso (cosi' gli importi combaciano); valute nuove: cambio reale di Revolut
    const eur=cur==='EUR'?v:(rate?bkR2(v/rate):bkMoney(r[4]));
    if(isNaN(eur)){skipped++;continue;}
    let tipo=BK_REV_CATTIPO[cat]||'Pagamento';
    if(/Digital Assets/i.test(desc))tipo='Cambia valuta';
    const cl=bkApplyMem(mem,'Revolut',desc,eur,{canale:'Revolut',...bkRevClass(tipo,'',desc,v)});
    rows.push({persona:'Maicol',data,fonte:'Revolut',canale:'Revolut',descrizione:desc,fpDesc:desc,importo_orig:v,valuta:cur,importo_eur:eur,categoria:cl.categoria,tipo:cl.tipo,conta:bkConta(cl.tipo),fuzzy:true});
  }
  return{rows,skipped,info:'interessi giornalieri e acquisti crypto non importati (usa l\'estratto conto CSV per gli interessi)'};
}
// Toglie le righe "fuzzy" che hanno gia' un corrispondente nello storico (stessa descrizione normalizzata, valuta e importo;
// data entro N giorni), una a una. Va chiamata DOPO bkFingerprints, cosi' i doppioni veri (#2, #3) restano distinti.
const bkNorm=s=>bkS(s).toLowerCase().replace(/[^a-z0-9\u00e0-\u00ff]/g,'').slice(0,40);
function bkFuzzyDrop(rows,dbRows,days){
  const pool={},key=(d,cur,eur)=>bkNorm(d)+'|'+cur+'|'+bkR2(+eur);
  for(const d of dbRows){
    if(d.fonte!=='Revolut'||d.tipo==='annullato')continue;
    const k=key(d.descrizione,d.valuta,d.importo_eur);(pool[k]=pool[k]||[]).push({t:Date.parse(d.data),used:false});
  }
  const keep=[];let dup=0;
  for(const r of rows){
    if(!r.fuzzy||r.tipo==='annullato'){keep.push(r);continue;}
    const t=Date.parse(r.data);let best=null;
    for(const c of pool[key(r.fpDesc,r.valuta,r.importo_eur)]||[])if(!c.used&&Math.abs(c.t-t)<=days*864e5&&(!best||Math.abs(c.t-t)<Math.abs(best.t-t)))best=c;
    if(best){best.used=true;dup++;}else keep.push(r);
  }
  return{keep,dup};
}

/* ---- Intesa Sanpaolo (Martina) ---- */
const BK_INTESA={
  'Stipendi e pensioni':['Stipendio','reddito'],'Bonifici ricevuti':['Bonifico ricevuto','reddito'],
  'Rate piani pensionistici':['Previdenza INPS','investimento'],'Investimenti, BDR e Salvadanaio':['Titoli/Fondi','investimento'],
  'Interessi e cedole':['Interessi/Cedole','reddito'],'Rimborsi spese e storni':['Rimborso','rimborso'],
  'Giroconto in entrata':['Giroconto','giroconto'],'Ricarica carte':['Ricarica','giroconto'],
  'Addebito mia carta di credito':['Carta di credito','spesa'],'Entrate varie':['Entrate varie','reddito']
};
function bkIntesa(grid){
  const hi=grid.findIndex(r=>bkS(r[0]).trim()==='Data'&&bkS(r[1]).trim()==='Operazione'),H=grid[hi].map(c=>bkS(c).trim());
  const iD=0,iO=H.indexOf('Operazione'),iDt=H.indexOf('Dettagli'),iC=H.findIndex(h=>h.startsWith('Categoria')),iV=H.indexOf('Valuta'),iI=H.indexOf('Importo');
  const rows=[];let skipped=0;
  for(const r of grid.slice(hi+1)){
    const data=bkDate(r[iD]),v=bkNum(r[iI]);
    if(!data||isNaN(v)){if(r.some(c=>bkS(c).trim()))skipped++;continue;}
    const op=bkS(r[iO]).trim(),det=bkS(r[iDt]).trim(),cat=bkS(r[iC]).trim(),cur=bkS(r[iV]).trim()||'EUR';
    if(cur!=='EUR'){skipped++;continue;}
    let categoria,tipo;
    if(BK_INTESA[cat])[categoria,tipo]=BK_INTESA[cat];
    else{categoria=cat||'Altro';tipo=v>0?'reddito':'spesa';}
    if(/Bonifici in uscita|Bonifico/i.test(cat+' '+op)&&BK_NOMI.io.test(op+' '+det)){categoria='Bonifico inviato';tipo='giroconto';}
    else if(cat==='Bonifici in uscita'){categoria='Bonifico inviato';tipo='spesa';}
    const useDet=det&&!/^(effettuato il|cod\.? ?disp)/i.test(det)&&det!==op;
    const desc=(useDet?op+' · '+det:op).slice(0,80);
    rows.push({persona:'Martina',data,fonte:'Martina',canale:'Conto Martina',descrizione:desc,fpDesc:op,importo_orig:v,valuta:'EUR',importo_eur:v,categoria,tipo,conta:bkConta(tipo)});
  }
  return{rows,skipped};
}

/* ---- Carta Ego (estratto conto carta di credito Credem) ---- */
const BK_CARTA_CAT=[
  ['Auto e trasporti',/CARBURANT|\bENI\b|TAMOIL|\bQ8\b|\bIP\b|HIGHWAY|AUTOSTRAD|TELEPASS|EUROPCAR|\bAVIS\b|HERTZ|SIXT|DOLLAR #|PARCHEGG|PARKING|TRENITALIA|ITALO|UBER|TAXI|\bATM\b|METRO|\bJR\b|JR EAST|JR WEST|JRNISHI|RAILWAY|SUICA|PASMO|KEISEI/],
  ['Viaggi',/BOOKING|AIRBNB|HOTEL|HOSTEL|RYANAIR|EASYJET|AIRLINE|AIRWAYS|AIRW\d|AIRPORT|CATHAY|VOLOTEA|WIZZ|KLOOK|AGODA|TRIP\.COM|EXPEDIA|VACASA|RESORT|TOURISTIK|CHARTER|FH\*|VIATOR/],
  ['Abbonamenti',/NETFLIX|SPOTIFY|APPLE\.COM|GOOGLE|YOUTUBE|ICLOUD|OPENAI|ANTHROPIC|DISNEY|DAZN|PATREON/],
  ['Ristoranti',/RISTOR|PIZZ|TRATTORIA|OSTERIA|CAFFE|COFFEE|\bBAR\b|GELAT|SUSHI|BAKERY|STARBUCKS|MCDONALD|BURGER|POTAGER|PATISS|BOULANG|BRASSERIE|SQ \*/],
  ['Alimentari',/SUPERSTORE|SUPERMERC|CONAD|\bCOOP\b|ESSELUNGA|CARREFOUR|LIDL|EUROSPIN|PANIFIC|MACELLER|SALUMER|\bIPER\b|WOOLWORTHS|MARKET/],
  ['Sport',/SPORT|GYM|PALESTRA|FITNESS|DECATHLON/],
  ['Shopping',/AMAZON|ZARA|H&M|UNIQLO|IKEA|PEUTEREY|ROY ROGER|MENS|ZALANDO|ABBIGL|FLABELUS|OUTLET|SHEIN|ALIEXPRESS|MEDIAWORLD|UNIEURO/]
];
function bkCartaClass(desc,v){
  const U=desc.toUpperCase();
  if(/REVOLUT\*\*/.test(U))return{categoria:'(interno)',tipo:'giroconto'}; // ricarica del conto Revolut pagata con la carta: la spesa vera e' su Revolut
  if(/IMPORTO MAGGIORAZIONE/.test(U))return{categoria:'Spese banca',tipo:'spesa'};
  if(/RIMBORSO/.test(U)&&v>0)return{categoria:'Rimborso',tipo:'rimborso'};
  if(/QUOTA ANNUA/.test(U))return{categoria:'Spese banca',tipo:'spesa'};
  if(v>0)return/PAGAMENTO|ADDEBITO|SALDO|ESTRATTO/.test(U)?{categoria:'Addebito Carta Ego',tipo:'giroconto'}:{categoria:'Rimborso',tipo:'rimborso'};
  for(const [c,re] of BK_CARTA_CAT)if(re.test(U))return{categoria:c,tipo:'spesa'};
  return{categoria:'Altro',tipo:'spesa'};
}
function bkCartaEgo(grid){
  const hi=grid.findIndex(r=>bkS(r[0]).trim()==='Data operazione'),H=grid[hi].map(c=>bkS(c).trim());
  const iDs=H.indexOf('Descrizione'),iI=H.indexOf('Importo');
  const all=grid.slice(hi+1).filter(r=>r.some(c=>bkS(c).trim()));
  const body=all.map(r=>({r,data:bkDate(r[0]),v:bkNum(r[iI]),key:r.slice(0,6).map(bkS).join('')})).filter(x=>x.data&&!isNaN(x.v));
  const{keep,doppie}=bkUndouble(body);
  const rows=keep.map(x=>{
    const desc=bkS(x.r[iDs]).replace(/\s*\(IMPORTO DIVISA ORIGINARIA[^)]*\)/i,'').replace(/\s+/g,' ').trim().slice(0,80),cl=bkCartaClass(desc,x.v);
    return{persona:'Maicol',data:x.data,fonte:'Credem',canale:'Carta Ego',descrizione:desc,fpDesc:desc,importo_orig:x.v,valuta:'EUR',importo_eur:x.v,categoria:cl.categoria,tipo:cl.tipo,conta:'sì'};
  });
  // Mesi di cui il file contiene il dettaglio COMPLETO: periodo dichiarato nel CSV, altrimenti i mesi interni a una serie continua
  const meta={};
  for(const r of grid.slice(0,hi)){const k=bkS(r[0]).trim();if(/^Data Inizio/i.test(k))meta.ini=bkDate(r[1]);if(/^Data Fine/i.test(k))meta.fine=bkDate(r[1]);}
  const coverage=[];
  if(meta.ini&&meta.fine)coverage.push(...bkMonthsWithin(meta.ini,meta.fine));
  else{
    const ms=[...new Set(rows.map(r=>r.data.slice(0,7)))].sort();let run=[];
    const flush=()=>{if(run.length>2)coverage.push(...run.slice(1,-1));run=[];};
    for(const m of ms){
      if(run.length){const[y,mm]=run[run.length-1].split('-').map(Number);if((mm===12?bkMonth(y+1,1):bkMonth(y,mm+1))!==m)flush();}
      run.push(m);
    }
    flush();
  }
  return{rows,skipped:all.length-body.length,doppie,coverage};
}
// L'addebito mensile Carta Ego nel c/c paga le spese del mese prima: se di quel mese c'e' il dettaglio, l'addebito diventa giroconto
const bkIsLump=r=>r.canale==='Carta Ego'&&r.tipo==='spesa'&&/ADDEBITO MESE CARTA EGO/i.test(r.descrizione||'');
function bkNeutralize(newRows,dbRows,cov){
  const hit=r=>bkIsLump(r)&&cov.has(bkPrevMonth(r.data)),upd=[];
  for(const r of newRows)if(hit(r)){r.tipo='giroconto';r.categoria='Addebito Carta Ego';}
  for(const r of dbRows)if(hit(r))upd.push(r);
  return upd;
}

/* ---- Foglio "Movimenti" gia' elaborato (formato precedente) ---- */
function bkDatabase(grid){
  const H=grid[0].map(c=>bkS(c).trim()),g=n=>H.indexOf(n),rows=[];let skipped=0;
  for(const r of grid.slice(1)){
    const data=bkDate(r[g('Data')]),v=bkNum(r[g('Importo €')]);
    if(!r[g('Persona')]||!data||isNaN(v)){skipped++;continue;}
    const desc=bkS(r[g('Descrizione')]);
    rows.push({persona:r[g('Persona')],data,fonte:r[g('Fonte')],canale:r[g('Canale')],descrizione:desc,fpDesc:desc,importo_orig:bkNum(r[g('Importo orig.')])||0,valuta:r[g('Valuta')]||'EUR',importo_eur:v,categoria:r[g('Categoria')],tipo:r[g('Tipo')],conta:r[g('Conta')]});
  }
  return{rows,skipped};
}

const BK_LABEL={revolut_consolidato:'Revolut (consolidato)',revolut:'Revolut · Maicol',credem:'Credem · Maicol',intesa:'Intesa · Martina',database:'Foglio Movimenti',cartaego:'Carta Ego · Maicol'};
async function bkParseFile(f,mem,fx){
  let grids;
  if(/\.(csv|txt)$/i.test(f.name)){
    const buf=await f.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);
    if(text.includes('�'))text=new TextDecoder('windows-1252').decode(buf);
    text=text.replace(/^﻿/,'');
    const first=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,3).join('\n'),d=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
    grids=[bkCsv(text,d)];
  }else{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    grids=wb.SheetNames.map(sn=>XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}));
  }
  for(const grid of grids){
    const kind=bkDetect(grid);
    if(!kind)continue;
    const res=kind==='revolut_consolidato'?bkRevolutConsolidato(grid,mem):kind==='revolut'?bkRevolut(grid,mem,fx):kind==='credem'?bkCredem(grid,mem):kind==='intesa'?bkIntesa(grid):kind==='cartaego'?bkCartaEgo(grid):bkDatabase(grid);
    return{name:f.name,kind,...res};
  }
  return{name:f.name,kind:null,rows:[],skipped:0};
}
// Impronta anti-duplicati: identica a quella dello storico; la 2a, 3a... riga uguale nello stesso import prende il suffisso #2, #3
// Righe uguali in file DIVERSI (r.src) sono la stessa operazione (download sovrapposti): contate una sola volta
function bkFingerprints(rows){
  const seen={},uniq=new Set(),out=[];
  for(const r of rows){
    const base=`${r.persona}|${r.data}|${bkR2(+r.importo_eur)}|${bkS(r.fpDesc).slice(0,60)}`,k=base+''+r.src,n=seen[k]=(seen[k]||0)+1,fp=n>1?`${base}#${n}`:base;
    if(uniq.has(fp))continue;
    uniq.add(fp);r.fingerprint=fp;out.push(r);
  }
  return out;
}

function bkRanges(ms){
  const a=[...ms].sort(),out=[],nx=m=>{const[y,mm]=m.split('-').map(Number);return mm===12?bkMonth(y+1,1):bkMonth(y,mm+1);};
  let s=null,p=null;
  for(const m of a){
    if(s===null){s=p=m;}
    else if(nx(p)===m){p=m;}
    else{out.push(s===p?s:s+' → '+p);s=p=m;}
  }
  if(s!==null)out.push(s===p?s:s+' → '+p);
  return out.join(', ');
}
async function spImpFiles(e){
  const files=[...e.target.files];if(!files.length)return;
  const prev=document.getElementById('sp-prev'),btn=document.getElementById('sp-savebtn');
  btn.disabled=true;prev.textContent='Leggo i file…';
  try{
    await spLoadNomi();
    const mem=bkMemory(spState.rows),parsed=[];let fx={};
    for(const f of files){
      let p=await bkParseFile(f,mem,fx);
      if(p.noFx&&Object.keys(p.noFx).length){Object.assign(fx,await spFetchFx(Object.keys(p.noFx)));p=await bkParseFile(f,mem,fx);}
      parsed.push(p);
    }
    // Consolidato + CSV "Estratto conto" nella stessa importazione: il CSV e' la fonte, il consolidato conta solo dopo la sua ultima data
    const csvRev=parsed.filter(q=>q.kind==='revolut');
    if(csvRev.length)parsed.filter(p=>p.kind==='revolut_consolidato').forEach(p=>{
      const mx=csvRev.flatMap(q=>q.rows.map(r=>r.data)).sort().pop(),n0=p.rows.length;
      p.rows=p.rows.filter(r=>r.data>mx);p.coperte=n0-p.rows.length;
    });
    parsed.forEach((p,i)=>p.rows.forEach(r=>{r.src=i;}));
    const totIn=parsed.reduce((a,p)=>a+p.rows.length,0),fp=bkFingerprints(parsed.flatMap(p=>p.rows)),fz=bkFuzzyDrop(fp,spState.rows,5),all=fz.keep,tot=all.length+fz.dup,cross=totIn-fp.length;
    // Carta Ego: mesi di cui abbiamo il dettaglio completo (gia' registrati + quelli di questo import)
    const cartaIn=parsed.some(p=>p.kind==='cartaego'),covOld=await spLoadCov(),cov=new Set(covOld);
    parsed.forEach(p=>(p.coverage||[]).forEach(m=>cov.add(m)));
    const upd=bkNeutralize(all,spState.rows,cov);
    const have=new Set(spState.rows.map(r=>r.fingerprint)),nuovi=all.filter(r=>!have.has(r.fingerprint));
    const covChanged=cov.size!==covOld.length;
    spState.impRecs=nuovi.map(r=>({fingerprint:r.fingerprint,persona:r.persona,data:r.data,fonte:r.fonte,canale:r.canale,descrizione:r.descrizione,importo_orig:r.importo_orig,valuta:r.valuta,importo_eur:r.importo_eur,categoria:r.categoria,tipo:r.tipo,conta:r.conta}));
    spState.impUpd=upd;spState.impCov=[...cov].sort();spState.impCovChanged=covChanged;
    prev.innerHTML=spImpHTML(parsed,tot,cross,nuovi,upd,cov,cartaIn);
    const n=nuovi.length,extra=upd.length>0||covChanged;
    btn.disabled=!(n||extra);btn.textContent=n?'Salva '+n+' movimenti':(extra?'Applica':'Salva');
  }catch(err){prev.innerHTML='<span style="color:var(--neg)">Errore nella lettura: '+spEsc(err.message)+'</span>';}
  e.target.value='';
}
function spImpHTML(parsed,tot,cross,nuovi,upd,cov,cartaIn){
  const lines=parsed.map(p=>{
    if(!p.kind)return '<div style="color:var(--neg)">✕ '+spEsc(p.name)+' — formato non riconosciuto</div>';
    if(p.note)return '<div style="color:var(--neg)">⚠ '+spEsc(p.name)+' — '+spEsc(p.note)+'</div>';
    const ds=p.rows.map(r=>r.data).sort(),rng=ds.length?ds[0]+' → '+ds[ds.length-1]:'';
    let x='<div><span class="pos">✓</span> '+spEsc(p.name)+' — '+BK_LABEL[p.kind]+' · '+p.rows.length+' righe ('+rng+')';
    if(p.coverage&&p.coverage.length)x+='<br><span class="dim">dettaglio completo per: '+bkRanges(p.coverage)+'</span>';
    if(p.info)x+='<br><span class="dim">'+spEsc(p.info)+'</span>';
    if(p.coperte)x+=' \u00b7 '+p.coperte+' righe gi\u00e0 coperte dal CSV \u00abEstratto conto\u00bb caricato insieme: ignorate';
    if(p.doppie)x+=' · '+p.doppie+' righe doppie (download sovrapposti) scartate';
    if(p.skipped)x+=' · <span style="color:var(--neg)">'+p.skipped+' ignorate</span>';
    if(p.noFx&&Object.keys(p.noFx).length)x+=' · <span style="color:var(--neg)">senza tasso di cambio, escluse: '+Object.entries(p.noFx).map(([k,v])=>k+' '+v).join(', ')+'</span>';
    return x+'</div>';
  }).join('');
  const gia=tot-nuovi.length;
  let h='<div style="margin-bottom:10px">'+lines+'</div><div style="color:var(--txt);margin-bottom:8px"><b>'+nuovi.length+'</b> movimenti nuovi · '+gia+' già presenti'+(cross?' · '+cross+' presenti in più file (contati una volta)':'')+'</div>';
  // Addebiti mensili Carta Ego sostituiti dal dettaglio
  const nn=nuovi.filter(r=>r.categoria==='Addebito Carta Ego'&&/ADDEBITO MESE/i.test(r.descrizione)),nSum=[...upd,...nn].reduce((a,r)=>a+(+r.importo_eur),0);
  if(upd.length||nn.length)h+='<div style="margin-bottom:6px">ℹ Carta Ego: <b>'+(upd.length+nn.length)+' addebiti mensili</b> nel c/c ('+spEur(nSum)+') diventano «giroconto», perché ora c\'è il dettaglio delle spese della carta. '+(upd.length?upd.length+' sono movimenti già nel database e verranno aggiornati.':'')+'</div>';
  if(cartaIn){
    const left=[...spState.rows,...nuovi].filter(r=>bkIsLump(r)&&!cov.has(bkPrevMonth(r.data)));
    if(left.length)h+='<div style="margin-bottom:6px">⚠ Le spese di questi mesi restano come addebito unico «Carta Ego» (manca il dettaglio): <b>'+bkRanges(new Set(left.map(r=>bkPrevMonth(r.data))))+'</b>. Scarica anche quei periodi dal sito Credem.</div>';
  }
  if(!nuovi.length)return h;
  const by={};nuovi.forEach(r=>{const o=by[r.tipo]=by[r.tipo]||{n:0,t:0};o.n++;o.t+=+r.importo_eur;});
  h+='<table class="sp-tab" style="margin-bottom:10px"><thead><tr><th>Tipo</th><th>Movimenti</th><th>Totale</th></tr></thead><tbody>'
   +Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>'<tr><td class="t">'+spEsc(k)+'</td><td>'+o.n+'</td><td>'+spEur(o.t)+'</td></tr>').join('')+'</tbody></table>';
  const altro=nuovi.filter(r=>r.categoria==='Altro').length,rip=nuovi.filter(r=>r.fingerprint.includes('#')).length;
  if(altro)h+='<div style="margin-bottom:6px">⚠ '+altro+' movimenti finiscono in «Altro» (descrizione non riconosciuta).</div>';
  if(rip)h+='<div style="margin-bottom:6px">ℹ '+rip+' sono identici a un altro movimento dello stesso giorno (stessa cifra e descrizione): li considero operazioni distinte.</div>';
  const sample=nuovi.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,12);
  h+='<div style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="sp-tab"><thead><tr><th>Data</th><th style="text-align:left">Descrizione</th><th style="text-align:left">Categoria</th><th style="text-align:left">Tipo</th><th>Importo</th></tr></thead><tbody>'
   +sample.map(r=>'<tr><td class="t">'+r.data+'</td><td class="t">'+spEsc(r.descrizione.replace(/\s+/g,' ').slice(0,40))+'</td><td class="t">'+spEsc(r.categoria)+'</td><td class="t">'+spEsc(r.tipo)+'</td><td>'+spEur(r.importo_eur)+'</td></tr>').join('')
   +'</tbody></table></div>'+(nuovi.length>12?'<div class="dim" style="margin-top:4px;font-size:11px">Prime 12 di '+nuovi.length+' (le più recenti).</div>':'');
  return h;
}
async function spImpSave(){
  const b=document.getElementById('sp-savebtn'),recs=spState.impRecs;b.disabled=true;b.textContent='Salvo…';
  let ok=true;
  for(let i=0;i<recs.length;i+=500){
    const{error}=await sb.from('expenses').upsert(recs.slice(i,i+500),{onConflict:'fingerprint',ignoreDuplicates:true});
    if(error){alert('Errore nel salvataggio: '+error.message);ok=false;break;}
  }
  for(const r of (ok?spState.impUpd:[])){
    const{error}=await sb.from('expenses').update({tipo:'giroconto',categoria:'Addebito Carta Ego'}).eq('fingerprint',r.fingerprint);
    if(error){alert('Errore nell\'aggiornamento degli addebiti Carta Ego: '+error.message);ok=false;break;}
  }
  if(ok&&spState.impCovChanged){
    const{error}=await sb.from('settings').upsert({key:'carta_ego_coperti',value:JSON.stringify(spState.impCov)},{onConflict:'key'});
    if(error){alert('Errore nel salvataggio dei mesi coperti: '+error.message);ok=false;}
  }
  b.textContent='Salva';
  if(!ok){b.disabled=false;return;}
  document.getElementById('sp-ov').classList.remove('on');
  spState.rows=await spLoad();spDraw();setStatus('Importati '+recs.length+' movimenti');
}
async function renderSpese(){const v=$("#view");if(!spState.rows){v.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">Carico spese…</div>';spState.rows=await spLoad();}v.innerHTML=speseUI();spWire();spDraw();}

/* ===================== REGISTRO MOVIMENTI (Maicol + Martina, modificabile) ===================== */
const rgState={persona:'Tutti',anno:'Tutti',mese:'Tutti',dal:'',al:'',tipo:'Tutti',q:'',rev:false,limit:200};
const RG_FLOW=['reddito','rimborso','spesa','investimento'];
const RG_TIPI=[['spesa','Spesa'],['reddito','Entrata (reddito)'],['rimborso','Rimborso'],['investimento','Investimento'],['giroconto','Giroconto (tra conti)'],['escluso','Escluso dai conteggi'],['annullato','Annullato']];
const RG_MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const rgCounts=r=>RG_FLOW.includes(r.tipo)&&r.conta!=='no';
const rgClean=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const rgKey=r=>r.fonte+'|'+rgClean(r.descrizione).toUpperCase().slice(0,50)+'|'+(+r.importo_eur<0?'-':'+');
const rgOpt=(v,l,sel)=>`<option value="${spEsc(v)}"${sel?' selected':''}>${spEsc(l)}</option>`;

function rgFiltered(){
  const s=rgState,q=s.q.trim().toLowerCase();
  return spState.rows.filter(r=>{
    if(s.persona!=='Tutti'&&r.persona!==s.persona)return false;
    const d=r.data||'';
    if(s.dal||s.al){if(s.dal&&d<s.dal)return false;if(s.al&&d>s.al)return false;}
    else{if(s.anno!=='Tutti'&&d.slice(0,4)!==s.anno)return false;if(s.mese!=='Tutti'&&d.slice(5,7)!==s.mese)return false;}
    if(s.tipo==='__nc'){if(rgCounts(r))return false;}
    else if(s.tipo!=='Tutti'&&r.tipo!==s.tipo)return false;
    if(s.rev&&!/^(altro|altre uscite)$/i.test(r.categoria||''))return false;
    if(q&&!((r.descrizione||'')+' '+(r.categoria||'')+' '+(r.canale||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.id-a.id);
}
async function renderRegistro(){
  const v=$("#view");
  if(!spState.rows){v.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim)">Carico movimenti…</div>';spState.rows=await spLoad();}
  const s=rgState,anni=[...new Set(spState.rows.map(r=>(r.data||'').slice(0,4)).filter(Boolean))].sort().reverse();
  v.innerHTML=`<div class="rg-bar">
    <div><label>Persona</label><select id="rg-persona">${['Tutti','Maicol','Martina'].map(p=>rgOpt(p,p,p===s.persona)).join('')}</select></div>
    <div><label>Anno</label><select id="rg-anno">${rgOpt('Tutti','Tutti',s.anno==='Tutti')}${anni.map(a=>rgOpt(a,a,a===s.anno)).join('')}</select></div>
    <div><label>Mese</label><select id="rg-mese">${rgOpt('Tutti','Tutti',s.mese==='Tutti')}${RG_MESI.map((m,i)=>rgOpt(String(i+1).padStart(2,'0'),m,String(i+1).padStart(2,'0')===s.mese)).join('')}</select></div>
    <div><label>Dal</label><input type="date" id="rg-dal" value="${s.dal}"></div>
    <div><label>Al</label><input type="date" id="rg-al" value="${s.al}"></div>
    <div><label>Tipo</label><select id="rg-tipo-f">${rgOpt('Tutti','Tutti',s.tipo==='Tutti')}${RG_TIPI.map(t=>rgOpt(t[0],t[1],t[0]===s.tipo)).join('')}${rgOpt('__nc','Non conteggiati (tutti)',s.tipo==='__nc')}</select></div>
    <div style="flex:1;min-width:170px"><label>Cerca</label><input id="rg-q" placeholder="descrizione, categoria…" value="${spEsc(s.q)}"></div>
    <label class="rg-chk"><input type="checkbox" id="rg-rev"${s.rev?' checked':''}> Solo «Altro»</label>
    <button class="sp-act ghost" id="rg-reset">Azzera</button>
  </div>
  <div class="kpis" id="rg-kpis"></div><div id="rg-list"></div>`;
  const on=(id,ev,fn)=>document.getElementById(id).addEventListener(ev,fn);
  const redraw=()=>{s.limit=200;rgDrawList();};
  on('rg-persona','change',e=>{s.persona=e.target.value;redraw();});
  on('rg-anno','change',e=>{s.anno=e.target.value;s.dal=s.al='';$('#rg-dal').value=$('#rg-al').value='';redraw();});
  on('rg-mese','change',e=>{s.mese=e.target.value;s.dal=s.al='';$('#rg-dal').value=$('#rg-al').value='';redraw();});
  const rng=()=>{s.dal=$('#rg-dal').value;s.al=$('#rg-al').value;if(s.dal||s.al){s.anno=s.mese='Tutti';$('#rg-anno').value=$('#rg-mese').value='Tutti';}redraw();};
  on('rg-dal','change',rng);on('rg-al','change',rng);
  on('rg-tipo-f','change',e=>{s.tipo=e.target.value;redraw();});
  on('rg-q','input',e=>{s.q=e.target.value;redraw();});
  on('rg-rev','change',e=>{s.rev=e.target.checked;redraw();});
  on('rg-reset','click',()=>{Object.assign(s,{persona:'Tutti',anno:'Tutti',mese:'Tutti',dal:'',al:'',tipo:'Tutti',q:'',rev:false,limit:200});renderRegistro();});
  rgDrawList();
}
function rgDrawList(){
  const rows=rgFiltered(),s=rgState,cnt=rows.filter(rgCounts);
  const sum=f=>cnt.filter(f).reduce((a,r)=>a+(+r.importo_eur),0);
  const ent=sum(r=>r.tipo==='reddito'||r.tipo==='rimborso'),usc=Math.abs(sum(r=>r.tipo==='spesa')),inv=Math.abs(sum(r=>r.tipo==='investimento')),risp=ent-usc;
  $("#rg-kpis").innerHTML=`<div class="kpi"><div class="lab">Movimenti</div><div class="val">${rows.length}</div><div class="sub dim">${rows.length-cnt.length} non conteggiati</div></div>
    <div class="kpi"><div class="lab">Entrate</div><div class="val">${spEur(ent)}</div></div>
    <div class="kpi"><div class="lab">Uscite</div><div class="val">${spEur(usc)}</div></div>
    <div class="kpi"><div class="lab">Risparmio</div><div class="val" style="color:${risp>=0?'var(--pos)':'var(--neg)'}">${spEur(risp)}</div></div>
    <div class="kpi"><div class="lab">Investito</div><div class="val" style="color:#a78bfa">${spEur(inv)}</div></div>`;
  const shown=rows.slice(0,s.limit);
  const body=shown.map(r=>{
    const flow=RG_FLOW.includes(r.tipo),eur=+r.importo_eur,d=rgClean(r.descrizione);
    return `<tr class="${rgCounts(r)?'':'rg-off'}"><td class="t">${r.data||''}</td><td class="t">${spEsc(r.persona)}</td>
      <td class="t rg-d" title="${spEsc(d)}">${spEsc(d.slice(0,64))}</td><td class="t">${spEsc(r.categoria||'')}</td>
      <td class="t"><span class="badge" style="margin:0">${spEsc(r.tipo||'')}</span></td>
      <td class="${eur<0?'neg':'pos'}">${eur<0?'−':''}€${money2(Math.abs(eur))}</td>
      <td style="text-align:center">${flow?`<input type="checkbox" class="rg-cb" data-id="${r.id}"${r.conta!=='no'?' checked':''}>`:'<span class="dim">—</span>'}</td>
      <td><button class="edit" data-rg-edit="${r.id}">✎</button></td></tr>`;
  }).join('');
  $("#rg-list").innerHTML=rows.length?`<div class="panel" style="overflow-x:auto"><table class="sp-tab rg-tab"><thead><tr><th>Data</th><th style="text-align:left">Persona</th><th style="text-align:left">Descrizione</th><th style="text-align:left">Categoria</th><th style="text-align:left">Tipo</th><th>Importo</th><th style="text-align:center">Conta</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`
    +(rows.length>s.limit?`<div style="text-align:center;margin-bottom:20px"><button class="sp-act ghost" id="rg-more">Mostra altri 200 (restano ${rows.length-s.limit})</button></div>`:'')
    :'<div class="empty">Nessun movimento con questi filtri.</div>';
  const more=document.getElementById('rg-more');if(more)more.onclick=()=>{s.limit+=200;rgDrawList();};
  $("#rg-list").querySelectorAll('[data-rg-edit]').forEach(b=>b.onclick=()=>rgEdit(b.dataset.rgEdit));
  $("#rg-list").querySelectorAll('.rg-cb').forEach(c=>c.onchange=()=>rgToggle(c.dataset.id,c.checked,c));
}
const rgById=id=>spState.rows.find(x=>String(x.id)===String(id));
async function rgToggle(id,on,el){
  const r=rgById(id);if(!r)return;
  const{error}=await sb.from('expenses').update({conta:on?'sì':'no'}).eq('id',r.id);
  if(error){alert('Errore nel salvataggio: '+error.message);el.checked=!on;return;}
  r.conta=on?'sì':'no';setStatus('Salvato');rgDrawList();
}
function rgEdit(id){
  const r=rgById(id);if(!r)return;
  const cats=[...new Set(spState.rows.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
  const key=rgKey(r),same=spState.rows.filter(x=>x.id!==r.id&&x.persona===r.persona&&rgKey(x)===key);
  const eur=+r.importo_eur;
  openModal(`<h2>Modifica movimento</h2>
    <div class="dim mono" style="font-size:12px;margin-bottom:6px">${r.data} · ${spEsc(r.persona)} · ${spEsc(r.canale||r.fonte||'')} · <span class="${eur<0?'neg':'pos'}">${eur<0?'−':''}€${money2(Math.abs(eur))}</span></div>
    <div style="font-size:13px;margin-bottom:6px;word-break:break-word">${spEsc(rgClean(r.descrizione))}</div>
    <label>Categoria</label><input id="rg-cat" list="rg-cats" value="${spEsc(r.categoria||'')}"><datalist id="rg-cats">${cats.map(c=>`<option value="${spEsc(c)}">`).join('')}</datalist>
    <label>Tipo</label><select id="rg-tipo">${RG_TIPI.map(t=>rgOpt(t[0],t[1],t[0]===r.tipo)).join('')}</select>
    <label class="rg-chk" style="margin-top:14px"><input type="checkbox" id="rg-conta"> Conta nei totali (entrate / uscite / investimenti)</label>
    <div class="dim" style="font-size:11px;margin:4px 0 0 24px" id="rg-hint"></div>
    ${same.length?`<label class="rg-chk" style="margin-top:14px"><input type="checkbox" id="rg-all"> Applica anche agli altri <b>${same.length}</b> movimenti con la stessa descrizione</label>`:''}
    <div class="foot"><button class="cancel" data-close>Annulla</button><button class="save" id="rg-save">Salva</button></div>`);
  const tipoEl=$("#rg-tipo"),contaEl=$("#rg-conta"),hint=$("#rg-hint");
  const sync=(fromTipo)=>{
    const flow=RG_FLOW.includes(tipoEl.value);
    contaEl.disabled=!flow;
    if(!flow){contaEl.checked=false;hint.textContent='Questo tipo non entra mai nei totali.';}
    else{if(fromTipo)contaEl.checked=true;hint.textContent='';}
  };
  contaEl.checked=r.conta!=='no';sync(false);
  if(!RG_FLOW.includes(r.tipo))contaEl.checked=false;
  tipoEl.onchange=()=>sync(true);
  $("#rg-save").onclick=async()=>{
    const cat=$("#rg-cat").value.trim()||r.categoria,tipo=tipoEl.value,flow=RG_FLOW.includes(tipo);
    const conta=tipo==='escluso'?'no':(flow?(contaEl.checked?'sì':'no'):'sì');
    const all=document.getElementById('rg-all'),targets=[r,...(all&&all.checked?same:[])];
    const{error}=await sb.from('expenses').update({categoria:cat,tipo,conta}).in('id',targets.map(x=>x.id));
    if(error){alert('Errore nel salvataggio: '+error.message);return;}
    targets.forEach(x=>{x.categoria=cat;x.tipo=tipo;x.conta=conta;});
    closeModal();setStatus('Salvato');rgDrawList();
  };
}


boot();
</script>
