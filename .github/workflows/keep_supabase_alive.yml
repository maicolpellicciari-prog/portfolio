name: Tieni attivo Supabase

# Il piano gratuito mette in pausa i progetti dopo ~7 giorni senza attivita'.
# Questa richiesta al database (lun e gio) evita la pausa.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl --fail --silent --show-error \
            "https://xrnujmdrtiliiqhntkwj.supabase.co/rest/v1/settings?select=key&limit=1" \
            -H "apikey: sb_publishable_-gGrlvd2-q2e-oJpUVYtuw_9JJo05yu"
