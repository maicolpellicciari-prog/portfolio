name: Aggiorna prezzi portafoglio

"on":
  schedule:
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna prezzi
        run: python aggiorna_prezzi.py

      - name: Commit e push prezzi_live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prezzi_live.json
          git diff --staged --quiet && echo "Nessuna variazione" || (
            git commit -m "prezzi: aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
