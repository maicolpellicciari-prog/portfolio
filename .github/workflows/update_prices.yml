name: Aggiorna prezzi portafoglio

# Ogni giorno lun-ven alle 19:30 UTC (21:30 ora italiana, dopo la chiusura dei mercati USA)
# scarica i prezzi (Yahoo Finance) e li scrive nel database Supabase, che e' quello letto dalla app.
# Il venerdi' salva anche lo snapshot dell'andamento (grafico "Storico").
# Serve anche a tenere attivo il progetto Supabase (il piano gratuito va in pausa dopo 7 giorni senza attivita').
#
# Richiede due "secrets" nel repo (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_URL          es. https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY  la chiave *secret* / service_role di Supabase
on:
  schedule:
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # serve solo al passaggio finale che tiene attivo il repository
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla i secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Mancano i secrets SUPABASE_URL e/o SUPABASE_SERVICE_KEY. Aggiungili in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Aggiorna prezzi (e snapshot il venerdi')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%u)" = "5" ]; then
            python aggiorna.py --no-excel
          else
            python aggiorna.py --no-excel --no-snapshot
          fi

      # GitHub disattiva le esecuzioni programmate di un repository pubblico dopo 60 giorni senza attivita'.
      # Se l'ultimo commit ha piu' di 45 giorni, ne facciamo uno vuoto per tenerlo attivo.
      - name: Tieni attivo il repository
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          giorni=$(( (now - last) / 86400 ))
          echo "Ultimo commit: $giorni giorni fa"
          if [ "$giorni" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: nessuna attivita' da oltre 45 giorni"
            git push
          fi
