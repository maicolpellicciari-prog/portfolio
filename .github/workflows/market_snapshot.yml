name: Fotografia dei mercati, notizie e trimestrali

# Lun-ven alle 22:15 UTC (06:15 del mattino a Shanghai, martedi'-sabato) scarica gli indici (azionari, VIX, oro, Bitcoin, cambio, tassi, petrolio) da Yahoo Finance
# e li salva nel database (settings, chiave 'market_snapshot'). Li legge la routine che prepara il riassunto
# giornaliero delle notizie alle 23:00 UTC (07:00 a Shanghai), perche' dal cloud di Claude yfinance non si puo' installare.
# Subito dopo cerca su Google News i titoli recenti sulle societa' in portafoglio (lette dal database) e li salva
# in settings, chiave 'company_news' (company_news.py).
# Poi salva le trimestrali (ultima e prossima, utile per azione atteso/reale) delle societa' piu' pesanti del portafoglio,
# anche dentro ETF e fondi (earnings.py, chiave 'earnings').
# Usa gli stessi secrets di "Aggiorna prezzi portafoglio" (SUPABASE_URL, SUPABASE_SERVICE_KEY).
on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla i secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Mancano i secrets SUPABASE_URL e/o SUPABASE_SERVICE_KEY."
            exit 1
          fi

      - name: Salva la fotografia dei mercati
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python market_snapshot.py

      - name: Salva le notizie sulle societa' in portafoglio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python company_news.py

      - name: Salva le trimestrali delle societa' piu' pesanti
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python earnings.py
